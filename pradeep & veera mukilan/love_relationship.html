<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Love Relationship</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #f6f1ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: min(900px, 100%);
      background: rgba(255, 255, 255, 0.85);
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(180, 92, 122, 0.2);
      padding: 32px;
    }

    h1 {
      text-align: center;
      color: #b3476b;
      margin-bottom: 20px;
      font-size: 2.2rem;
    }

    .input-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    input {
      padding: 12px 14px;
      border: 2px solid #f2bfd1;
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
    }

    button {
      background: linear-gradient(135deg, #ff5f8f, #d94b7a);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border: 2px solid #f8dfe7;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      color: #7d2f4b;
      margin-bottom: 14px;
      font-size: 1.4rem;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 10px;
    }

    li {
      background: #fff5f8;
      padding: 10px 12px;
      border-radius: 10px;
      color: #4f2f38;
      border-left: 5px solid #ef7da4;
    }

    .shared {
      margin-top: 16px;
      background: linear-gradient(135deg, #f9e7f0, #fdf1f8);
      border: 2px solid #f4bfd6;
      border-radius: 20px;
      padding: 22px;
    }

    .shared h3 {
      margin-bottom: 16px;
      color: #8d3656;
      text-align: center;
      font-size: 1.5rem;
    }

    .shared-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .list-box {
      background: white;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #f1d8e4;
    }

    .list-box h4 {
      margin-bottom: 12px;
      color: #a33e66;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Love Relationship</h1>

    <div class="input-box">
      <input id="person1" type="text" value="Aisha" placeholder="Your name" />
      <input id="person2" type="text" value="Arjun" placeholder="Partner name" />
      <button onclick="updateRelationship()">Join Their Relationship</button>
    </div>

    <div class="cards">
      <div class="card">
        <h2 id="name1">Aisha</h2>
        <ul id="side1"></ul>
      </div>

      <div class="card">
        <h2 id="name2">Arjun</h2>
        <ul id="side2"></ul>
      </div>
    </div>

    <div class="shared">
      <h3 id="relationshipTitle">Aisha and Arjun</h3>
      <div class="shared-grid">
        <div class="list-box">
          <h4>Advantages</h4>
          <ul id="advantagesList"></ul>
        </div>

        <div class="list-box">
          <h4>Disadvantages</h4>
          <ul id="disadvantagesList"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="love_relationship.js"></script>
</body>
</html>
