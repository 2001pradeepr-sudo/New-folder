<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Beautiful Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            padding: 40px 25px;
            text-align: center;
            color: white;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            margin-top: 25px;
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #667eea;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Welcome! 🎨</h1>

        <p>
            My Beautiful Website
            <br>
            HTML + CSS Design
        </p>

        <button onclick="alert('Welcome! 🎉')">
            Explore Now
        </button>
    </div>

</body>
</html>
